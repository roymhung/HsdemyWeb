spring.application.name=HsdemyWeb

spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/hstudemyweb
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#config spring security
# spring.security.user.name=hung
# spring.security.user.password=123456

#config view engine
# spring.mvc.view.prefix=/WEB-INF/view/
# spring.mvc.view.suffix=.jsp

# Upload limits (video)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2MB

# Tomcat request size handling for large uploads
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=500MB
